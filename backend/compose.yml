name: lanternfall
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lanternfall}
      MYSQL_USER: ${MYSQL_USER:-lanternfall}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python tools/setup_local.py first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python tools/setup_local.py first}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-33306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
  api:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-lanternfall}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-lanternfall}?charset=utf8mb4
      DB_AUTO_CREATE: "false"
    ports:
      # Loopback by default. For 真机调试 on the same Wi-Fi run with
      # API_BIND=0.0.0.0 docker compose up -d api and use your Mac's LAN IP.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
volumes:
  mysql_data:
