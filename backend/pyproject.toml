[project]
name = "lanternfall-backend"
version = "0.1.0"
description = "WeChat identity and revisioned game saves for Lanternfall"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1",
  "alembic>=1.14,<2", "pymysql[rsa]>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
